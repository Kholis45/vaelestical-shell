# ============================================================
# vxvicfg Shell — keybind tombol Super untuk Hyprland
#
# CARA PAKAI (pilih satu):
#   1. Tambahkan baris ini ke ~/.config/hypr/hyprland.conf:
#        source = ~/vxvicfg-shell/hyprland/vxvicfg-binds.conf
#      (sesuaikan path ke lokasi clone repo ini)
#   2. Atau copy-isi file ini langsung ke dalam hyprland.conf.
#
# CARA KERJA:
#   Tiap bind menulis satu kata perintah ke /tmp/vxvicfg.cmd.
#   Shell vxvicfg membaca file itu tiap 250ms dan toggle panel
#   yang sesuai. Tanpa shell yang sedang jalan, bind tidak ngapa-ngapain.
#   File boleh dihapus kapan saja (dibuat ulang otomatis).
#
# CONTOH AUTOSTART SHELL (taruh di hyprland.conf, pilih satu):
#   exec-once = qmlscene ~/vxvicfg-shell/main.qml
#   exec-once = python ~/vxvicfg-shell/run_shell.py
#
# WAJIB untuk metode qmlscene: izinkan baca file lokal via XHR
# (mekanisme IPC di atas membutuhkannya). Taruh di hyprland.conf:
#   env = QML_XHR_ALLOW_FILE_READ,1
# (run_shell.py sudah mengaturnya otomatis, jadi tidak perlu.)
# ============================================================

# --- Toggle panel (Super + huruf) ---
bind = SUPER, D, exec, sh -c 'echo dash >> /tmp/vxvicfg.cmd'
bind = SUPER, W, exec, sh -c 'echo wall >> /tmp/vxvicfg.cmd'
bind = SUPER, C, exec, sh -c 'echo control >> /tmp/vxvicfg.cmd'
bind = SUPER, S, exec, sh -c 'echo settings >> /tmp/vxvicfg.cmd'
bind = SUPER, U, exec, sh -c 'echo utils >> /tmp/vxvicfg.cmd'
bind = SUPER, G, exec, sh -c 'echo gaming >> /tmp/vxvicfg.cmd'
bind = SUPER, K, exec, sh -c 'echo utils >> /tmp/vxvicfg.cmd' # launcher+search ada di panel Utils

# --- Lockscreen overlay ---
bind = SUPER, L, exec, sh -c 'echo lock >> /tmp/vxvicfg.cmd'

# --- Haku minimalis (taskbar, settings modal, wallpaper, cava, menu, jam) ---
bind = SUPER, T, exec, sh -c 'echo taskbar >> /tmp/vxvicfg.cmd'
bind = SUPER, H, exec, sh -c 'echo hakusettings >> /tmp/vxvicfg.cmd'
bind = SUPER, N, exec, sh -c 'echo hakuwall >> /tmp/vxvicfg.cmd'
bind = SUPER, V, exec, sh -c 'echo cava >> /tmp/vxvicfg.cmd'
bind = SUPER, M, exec, sh -c 'echo hakumenu >> /tmp/vxvicfg.cmd'
bind = SUPER, B, exec, sh -c 'echo hakuclock >> /tmp/vxvicfg.cmd'

# --- Tema gelap/terang ---
bind = SUPER SHIFT, T, exec, sh -c 'echo theme >> /tmp/vxvicfg.cmd'

# Catatan konflik: keybind di atas menimpa bind default Hyprland
# untuk tombol yang sama (jika ada). Hapus/edit baris yang bentrok
# dengan workflow-mu.
