# ============================================================
# Vaelestical Shell — keybind tombol Super untuk Hyprland
#
# CARA PAKAI (pilih satu):
#   1. Tambahkan baris ini ke ~/.config/hypr/hyprland.conf:
#        source = ~/vaelestical-shell/hyprland/vaelestical-binds.conf
#      (sesuaikan path ke lokasi clone repo ini)
#   2. Atau copy-isi file ini langsung ke dalam hyprland.conf.
#
# CARA KERJA:
#   Tiap bind menulis satu kata perintah ke /tmp/vaelestical.cmd.
#   Shell Vaelestical membaca file itu tiap 250ms dan toggle panel
#   yang sesuai. Tanpa shell yang sedang jalan, bind tidak ngapa-ngapain.
#   File boleh dihapus kapan saja (dibuat ulang otomatis).
#
# CONTOH AUTOSTART SHELL (taruh di hyprland.conf, pilih satu):
#   exec-once = qmlscene ~/vaelestical-shell/main.qml
#   exec-once = python ~/vaelestical-shell/run_shell.py
#
# WAJIB untuk metode qmlscene: izinkan baca file lokal via XHR
# (mekanisme IPC di atas membutuhkannya). Taruh di hyprland.conf:
#   env = QML_XHR_ALLOW_FILE_READ,1
# (run_shell.py sudah mengaturnya otomatis, jadi tidak perlu.)
# ============================================================

# --- Toggle panel (Super + huruf) ---
bind = SUPER, D, exec, sh -c 'echo dash >> /tmp/vaelestical.cmd'
bind = SUPER, W, exec, sh -c 'echo wall >> /tmp/vaelestical.cmd'
bind = SUPER, C, exec, sh -c 'echo control >> /tmp/vaelestical.cmd'
bind = SUPER, S, exec, sh -c 'echo settings >> /tmp/vaelestical.cmd'
bind = SUPER, U, exec, sh -c 'echo utils >> /tmp/vaelestical.cmd'
bind = SUPER, G, exec, sh -c 'echo gaming >> /tmp/vaelestical.cmd'
bind = SUPER, K, exec, sh -c 'echo utils >> /tmp/vaelestical.cmd' # launcher+search ada di panel Utils

# --- Lockscreen overlay ---
bind = SUPER, L, exec, sh -c 'echo lock >> /tmp/vaelestical.cmd'

# --- Tema gelap/terang ---
bind = SUPER SHIFT, T, exec, sh -c 'echo theme >> /tmp/vaelestical.cmd'

# Catatan konflik: keybind di atas menimpa bind default Hyprland
# untuk tombol yang sama (jika ada). Hapus/edit baris yang bentrok
# dengan workflow-mu.
